<section id="why-me" class="why-me">
  <h2>{{ 'whyMe.title' | translate }}</h2>

  <div class="content">
    <p class="location">
      <span class="pin" aria-hidden="true">
        <img class="pin-bg" src="icons/location-bg.svg" alt="" width="75" height="64" />
        <img class="pin-icon" src="icons/location-pin.svg" alt="" width="75" height="64" />
        <img class="shadow" src="icons/location-shadow.svg" alt="" width="21" height="9" />
      </span>
      <span>
        <strong>{{ 'whyMe.locationPrefix' | translate }}</strong>
        {{ 'whyMe.locationText' | translate }}<span class="cursor" aria-hidden="true">|</span>
      </span>
    </p>

    <div class="text">
      <p>{{ 'whyMe.text1' | translate }}</p>
      <p>{{ 'whyMe.text2' | translate }}</p>
      <a href="#contact" class="btn btn-secondary">{{ 'whyMe.button' | translate }}</a>
    </div>
  </div>
</section>
