@if (order() === 'footer') {
  <ng-container *ngTemplateOutlet="github" />
  <ng-container *ngTemplateOutlet="email" />
} @else {
  <ng-container *ngTemplateOutlet="email" />
  <ng-container *ngTemplateOutlet="github" />
}
<a [href]="links.linkedin" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'social.linkedin' | translate">
  <img [src]="icon('linkedin')" alt="" width="30" height="30" />
</a>

<ng-template #email>
  <a [href]="'mailto:' + links.email" [attr.aria-label]="'social.email' | translate">
    <img [src]="icon('email')" alt="" width="30" height="30" />
  </a>
</ng-template>
<ng-template #github>
  <a [href]="links.github" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'social.github' | translate">
    <img [src]="icon('github')" alt="" width="30" height="30" />
  </a>
</ng-template>
