@if (order() === 'footer') {
  <ng-container *ngTemplateOutlet="link; context: { $implicit: 'github' }" />
  <ng-container *ngTemplateOutlet="link; context: { $implicit: 'email' }" />
} @else {
  <ng-container *ngTemplateOutlet="link; context: { $implicit: 'email' }" />
  <ng-container *ngTemplateOutlet="link; context: { $implicit: 'github' }" />
}
<ng-container *ngTemplateOutlet="link; context: { $implicit: 'linkedin' }" />

<ng-template #link let-name>
  <a
    [href]="href(name)"
    [attr.target]="name === 'email' ? null : '_blank'"
    [attr.rel]="name === 'email' ? null : 'noopener noreferrer'"
    [attr.aria-label]="'social.' + name | translate"
  >
    <img class="icon-default" [src]="icon(name)" alt="" width="30" height="30" />
    <img class="icon-hover" [src]="icon(name, true)" alt="" width="30" height="30" />
  </a>
</ng-template>
