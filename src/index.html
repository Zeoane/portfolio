<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Gabriele Lerch | Frontend-Entwicklerin</title>
    <meta name="description" content="Portfolio von Gabriele Lerch, Frontend-Entwicklerin: Projekte, Skills und Kontakt." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#262e34" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Nur für Netlify Forms: So erkennt Netlify beim Deploy das Kontaktformular. Nicht sichtbar. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="privacy" />
      <input type="text" name="bot-field" />
    </form>
    <app-root></app-root>
  </body>
</html>
