# Netlify baut das Projekt bei jedem Push auf main automatisch neu.
[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "24"

# Angular-Routing: Unterseiten wie /impressum funktionieren auch beim Neuladen
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTTPS erzwingen und Basis-Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
